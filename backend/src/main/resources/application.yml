spring:
  application:
    name: worldcup-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/worldcup}
    username: ${DB_USERNAME:worldcup}
    password: ${DB_PASSWORD:worldcup}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # No default — the application refuses to boot in any environment that
    # doesn't supply JWT_SECRET. The dev profile overrides this in
    # application-dev.yml so local runs still work out of the box.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: worldcup-backend
  football-sync:
    # Disabled by default. When false the entire sync package (service,
    # scheduled jobs, admin endpoint) stays out of the application context —
    # the app behaves exactly as it did before this feature shipped.
    enabled: ${FOOTBALL_SYNC_ENABLED:false}
    # Which FootballDataClient implementation to wire in. Currently only
    # `football-data-org` is provided; add another by implementing the
    # interface and toggling the value.
    provider: ${FOOTBALL_PROVIDER:football-data-org}
    # Required when enabled=true. football-data.org issues free keys at
    # https://www.football-data.org/client/register.
    api-key: ${FOOTBALL_API_KEY:}
    # Competition identifier on the upstream provider. `WC` is the
    # football-data.org code for the FIFA World Cup.
    competition-id: ${FOOTBALL_COMPETITION_ID:WC}
    base-url: ${FOOTBALL_API_BASE_URL:https://api.football-data.org/v4}
    # How often syncMatches() polls. ISO-8601 duration; default 5 minutes.
    # Free tier of football-data.org allows 10 req/min so this is safe.
    match-interval: ${FOOTBALL_MATCH_INTERVAL:PT5M}
    # Daily team refresh, 04:00 server time by default.
    team-cron: ${FOOTBALL_TEAM_CRON:0 0 4 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
