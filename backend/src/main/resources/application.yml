spring:
  application:
    name: worldcup-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/worldcup}
    username: ${DB_USERNAME:worldcup}
    password: ${DB_PASSWORD:worldcup}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # No default — the application refuses to boot in any environment that
    # doesn't supply JWT_SECRET. The dev profile overrides this in
    # application-dev.yml so local runs still work out of the box.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: worldcup-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info
