server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback — any unknown path serves index.html so Angular's
    # router can take over. Same idea as Cloudflare's
    # `not_found_handling: "single-page-application"`.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundle assets get an immutable, far-future cache header.
    location ~* \.(?:js|mjs|css|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Don't cache index.html — needs to pick up new bundle hashes on deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # Quiet the access log on the health check.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
