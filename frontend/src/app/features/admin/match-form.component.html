<form class="admin-form" [formGroup]="form" (ngSubmit)="save()">
  <div class="grid">
    <label>
      <span>Home team</span>
      <input type="text" formControlName="homeTeam" />
    </label>
    <label>
      <span>Away team</span>
      <input type="text" formControlName="awayTeam" />
    </label>
    <label>
      <span>Kickoff</span>
      <input type="datetime-local" formControlName="kickoffTime" />
    </label>
    <label>
      <span>Venue</span>
      <input type="text" formControlName="venue" />
    </label>
    <label>
      <span>Stage</span>
      <select formControlName="stage">
        @for (stage of stages; track stage) {
          <option [value]="stage">{{ stage.replaceAll('_', ' ') }}</option>
        }
      </select>
    </label>
    @if (isGroupStage) {
      <label>
        <span>Group</span>
        <input type="text" formControlName="groupName" maxlength="16" placeholder="e.g. A" />
      </label>
    }
    <label>
      <span>Type</span>
      <select formControlName="matchType">
        @for (type of types; track type) {
          <option [value]="type">{{ type }}</option>
        }
      </select>
    </label>
  </div>

  <label class="check">
    <input type="checkbox" formControlName="isFinished" />
    <span>Finished</span>
  </label>

  @if (form.controls.isFinished.value) {
    <div class="grid result-grid">
      <label>
        <span>Home score</span>
        <input type="number" min="0" formControlName="homeScore" />
      </label>
      <label>
        <span>Away score</span>
        <input type="number" min="0" formControlName="awayScore" />
      </label>
      @if (form.controls.matchType.value === 'KNOCKOUT') {
        <label>
          <span>Qualified team</span>
          <select formControlName="qualifiedTeam">
            <option value="">Choose team</option>
            <option [value]="form.controls.homeTeam.value">{{ form.controls.homeTeam.value || 'Home team' }}</option>
            <option [value]="form.controls.awayTeam.value">{{ form.controls.awayTeam.value || 'Away team' }}</option>
          </select>
        </label>
      }
    </div>
  }

  <div class="actions">
    <button type="submit" class="primary" [disabled]="submitting()">
      {{ submitting() ? 'Saving...' : (match ? 'Update match' : 'Add match') }}
    </button>
    @if (match) {
      <button type="button" class="danger" (click)="remove()">Delete</button>
    }
    @if (feedback()) {
      <p class="feedback">{{ feedback() }}</p>
    }
  </div>
</form>
