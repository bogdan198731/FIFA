<section class="admin-page">
  <header class="header">
    <h1>Admin matches</h1>
    <p>Manage fixtures, kickoff times, stages, and match types.</p>
  </header>

  <section class="panel">
    <h2>Add match</h2>
    <app-match-form (saved)="upsert($event)" />
  </section>

  @switch (state()) {
    @case ('loading') {
      <p class="muted">Loading...</p>
    }
    @case ('error') {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }
    @case ('ready') {
      <div class="list">
        @for (match of matches(); track match.id) {
          <section class="panel">
            <h2>{{ match.homeTeam }} vs {{ match.awayTeam }}</h2>
            <app-match-form [match]="match" (saved)="upsert($event)" (deleted)="remove($event)" />
          </section>
        }
      </div>
    }
  }
</section>
