<section class="auth-card">
  <h1>{{ i18n.t()['auth.login.title'] }}</h1>
  <p class="muted">{{ i18n.t()['auth.login.subtitle'] }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>{{ i18n.t()['auth.login.username'] }}</span>
      <input
        type="text"
        autocomplete="username"
        formControlName="username"
        [attr.aria-invalid]="form.controls.username.invalid && form.controls.username.touched"
      />
    </label>

    <label>
      <span>{{ i18n.t()['auth.login.password'] }}</span>
      <input
        type="password"
        autocomplete="current-password"
        formControlName="password"
        [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
      />
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? i18n.t()['auth.login.submitting'] : i18n.t()['auth.login.submit'] }}
    </button>
  </form>

  <p class="muted switch">
    {{ i18n.t()['auth.login.noAccount'] }} <a routerLink="/register">{{ i18n.t()['auth.login.createOne'] }}</a>
  </p>
</section>
