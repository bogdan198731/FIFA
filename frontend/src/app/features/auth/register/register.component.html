<section class="auth-card">
  <h1>{{ i18n.t()['auth.register.title'] }}</h1>
  <p class="muted">{{ i18n.t()['auth.register.subtitle'] }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>{{ i18n.t()['auth.register.username'] }}</span>
      <input
        type="text"
        autocomplete="username"
        formControlName="username"
        [attr.aria-invalid]="form.controls.username.invalid && form.controls.username.touched"
      />
      @if (form.controls.username.touched && form.controls.username.errors?.['minlength']) {
        <small class="error">{{ i18n.t()['auth.register.error.username'] }}</small>
      }
    </label>

    <label>
      <span>{{ i18n.t()['auth.register.email'] }}</span>
      <input
        type="email"
        autocomplete="email"
        formControlName="email"
        [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
      />
      @if (form.controls.email.touched && form.controls.email.errors?.['email']) {
        <small class="error">{{ i18n.t()['auth.register.error.email'] }}</small>
      }
    </label>

    <label>
      <span>{{ i18n.t()['auth.register.password'] }}</span>
      <input
        type="password"
        autocomplete="new-password"
        formControlName="password"
        [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
      />
      @if (form.controls.password.touched && form.controls.password.errors?.['minlength']) {
        <small class="error">{{ i18n.t()['auth.register.error.password'] }}</small>
      }
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? i18n.t()['auth.register.submitting'] : i18n.t()['auth.register.submit'] }}
    </button>
  </form>

  <p class="muted switch">
    {{ i18n.t()['auth.register.hasAccount'] }} <a routerLink="/login">{{ i18n.t()['auth.register.signIn'] }}</a>
  </p>
</section>
